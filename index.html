<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#202020" />
  <title>Wildev OS</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="assets/wildev-mark.svg" alt="Wildev" class="brand-logo" />
        <div>
          <p class="brand-name">Wildev OS</p>
          <p class="brand-date" id="header-date"></p>
        </div>
      </div>
      <div class="top-right">
        <span id="sync-chip" class="sync-chip local">Local</span>
        <button class="icon-btn gear" data-goto="reminders" aria-label="Recordatorios">🔔</button>
        <button class="icon-btn gear" data-goto="settings" aria-label="Ajustes">⚙</button>
      </div>
    </header>

    <main id="view-host"></main>

    <nav class="bottom-nav">
      <button data-nav="today"><span>☀️</span>Hoy</button>
      <button data-nav="focus"><span>🎯</span>Foco</button>
      <button data-nav="work"><span>🚀</span>Trabajo</button>
      <button data-nav="money"><span>💰</span>Dinero</button>
      <button data-nav="body"><span>💪</span>Cuerpo</button>
      <button data-nav="mind"><span>🧠</span>Mente</button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>

  <script src="core/store.js"></script>
  <script src="core/app.js"></script>
  <script src="core/notify.js"></script>
  <script src="data/life.js"></script>
  <script src="data/routines.js"></script>
  <script src="data/foods.js"></script>
  <script src="data/abs-challenge.js"></script>
  <script src="data/exercise-dataset.js"></script>
  <script src="modules/today.js"></script>
  <script src="modules/focus.js"></script>
  <script src="modules/work.js"></script>
  <script src="modules/money.js"></script>
  <script src="modules/body.js"></script>
  <script src="modules/mind.js"></script>
  <script src="modules/reminders.js"></script>
  <script src="modules/settings.js"></script>
  <script>initApp();</script>
</body>
</html>
